<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="InvestIQ AI">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="investiq_ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>InvestIQ AI</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Sign-In (Web): Firebase Auth popup is used from Dart (firebase_auth).
    See CONFIGURATION_REQUIRED.md
  -->
</head>
<body>
  <!--
    Use locally served CanvasKit (same origin) so Chrome does not depend on
    gstatic.com — which often fails behind corporate proxies / filters and
    leaves localhost:xxxxx blank/stuck.
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      config: {
        canvasKitBaseUrl: "canvaskit/"
      }
    });
  </script>
</body>
</html>
