name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: investiq
          POSTGRES_PASSWORD: investiq
          POSTGRES_DB: investiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U investiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format check
        working-directory: backend
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgres://investiq:investiq@localhost:5432/investiq
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            export JWT_SECRET='ci-test-secret-key-not-for-production!!'
          fi
          cargo test

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Write Firebase dart-defines from secrets
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            printf '%s\n' "$FIREBASE_CONFIG_JSON" > mobile/config/firebase.dart-define.json
            echo "Wrote mobile/config/firebase.dart-define.json from FIREBASE_CONFIG_JSON"
          else
            echo "FIREBASE_CONFIG_JSON not set — analyze/test without live Firebase defines"
            cp mobile/config/firebase.dart-define.json.example \
              mobile/config/firebase.dart-define.json
          fi
      - name: Write google-services.json from secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
            echo "Wrote mobile/android/app/google-services.json from GOOGLE_SERVICES_JSON"
          else
            echo "GOOGLE_SERVICES_JSON not set — skip Android google-services file"
          fi
      - name: Pub get
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Debug APK when Firebase config is real
        working-directory: mobile
        env:
          API_BASE_URL: http://127.0.0.1:8080
        run: |
          if grep -q 'REPLACE_WITH' config/firebase.dart-define.json 2>/dev/null; then
            echo "Placeholder Firebase config — skip APK build"
            exit 0
          fi
          flutter build apk --debug \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define-from-file=config/firebase.dart-define.json

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t investiq-api:ci ./backend
