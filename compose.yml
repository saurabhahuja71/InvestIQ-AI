# InvestIQ AI — Podman Compose (compatible with podman compose / podman-compose)
# Usage:
#   podman compose up -d postgres redis
#   podman compose up -d --build
#   podman compose down

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: investiq
      POSTGRES_PASSWORD: investiq
      POSTGRES_DB: investiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://investiq:investiq@postgres:5432/investiq
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-secret-key!!}
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.x.ai/v1}
      AI_MODEL: ${AI_MODEL:-grok-2-latest}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
